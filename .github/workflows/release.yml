name: ETJump Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/branch/SHA) to check out. Defaults to the ref that triggered the caller."
        required: false
        type: string
        default: master

  push:
    # version tags only, the rolling 'latest' tag should not trigger releases
    tags:
      - "[0-9]*"

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  package:
    name: Package
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: etjump-artifacts-*
          merge-multiple: true
          path: ${{ github.workspace }}/build/etjump

      - name: Pack release zip
        working-directory: ${{ github.workspace }}/build
        run: |
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          make mod_release

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ETJump ${{ github.ref_name }}
          files: ${{ github.workspace }}/build/*.zip
          draft: true
