name: ETJump Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/branch/SHA) to check out. Defaults to the ref that triggered the caller."
        required: false
        type: string
        default: master

  push:
    # version tags only, the rolling 'latest' tag should not trigger releases
    tags:
      - "[0-9]*"

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  package:
    name: Package
    needs: build
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  upload:
    name: Upload
    needs: package
    runs-on: ubuntu-22.04

    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: etjump-package
          path: ${{ github.workspace }}/build

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ETJump ${{ github.ref_name }}
          files: ${{ github.workspace }}/build/*.zip
          draft: true
