name: ETJump CI

on:
  push:
    branches: [master, dev]
    tags-ignore:
      - "*"
    paths-ignore:
      - docs/*
      - .gitignore
      - .gitattributes
      - .clang-format
      - README.md
      - VERSION.txt
      - release.sh

  pull_request:
    branches: [master, dev]
    paths-ignore:
      - docs/*
      - .gitignore
      - .gitattributes
      - .clang-format
      - README.md
      - VERSION.txt
      - release.sh

  merge_group:

jobs:
  build:
    uses: ./.github/workflows/build.yml
